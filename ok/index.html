<title>Your appointment · 8kblends</title>
<meta name="robots" content="noindex, nofollow">

<body class="theme-lightning ok-page">
<div class="wrap">
  <header class="masthead">
    <img class="logo logo-sm" src="/assets/logo.webp" width="994" height="599" alt="8kblends, Crafted with Detail">
    <h1 class="byline">Tyler Campbell <span aria-hidden="true">·</span> House calls · Bay Area</h1>
  </header>

  <main class="panel">
    <section data-view="loading">
      <p class="book-wait">Loading…</p>
    </section>

    <section class="ok-view" data-view="booking" hidden>
      <h2 class="hook" data-title>See you soon</h2>
      <p class="book-when" data-when></p>
      <div class="ok-where" data-where-row>
        <span aria-hidden="true">📍</span><span class="ok-where-text" data-where></span>
        <button class="link-btn" type="button" data-edit>Edit</button>
      </div>
      <fieldset class="chips ok-spot" data-spot hidden>
        <legend>Where should the chair go?</legend>
        <label class="chip"><input type="radio" name="spot" value="Backyard"><span>Backyard</span></label>
        <label class="chip"><input type="radio" name="spot" value="Indoors"><span>Indoors</span></label>
        <label class="chip"><input type="radio" name="spot" value="Garage"><span>Garage</span></label>
      </fieldset>
      <form class="book-form ok-edit" data-edit-form hidden>
        <label class="field"><span>Street address</span><input name="address" autocomplete="street-address" maxlength="120" required></label>
        <label class="field"><span>City</span><select name="city" data-city-select hidden></select><input name="city_text" data-city-text autocomplete="address-level2" maxlength="40"></label>
        <fieldset class="chips">
          <legend>Best place to set up?</legend>
        <label class="chip"><input type="radio" name="setup" value="Backyard"><span>Backyard</span></label>
        <label class="chip"><input type="radio" name="setup" value="Indoors"><span>Indoors</span></label>
        <label class="chip"><input type="radio" name="setup" value="Garage"><span>Garage</span></label>
        <label class="chip"><input type="radio" name="setup" value="Not sure yet"><span>Not sure yet</span></label>
        </fieldset>
        <label class="field"><span>Parking or gate notes (optional)</span><input name="notes" maxlength="200"></label>
        <button class="btn btn-primary" type="submit">Save</button>
      </form>
      <p class="done-text" data-note hidden></p>
      <button class="btn btn-primary" type="button" data-coming>Confirm 👍</button>
      <button class="btn btn-soft" type="button" data-cancel>Can't make it</button>
      <a class="link-btn" href="#" data-ics download="8kblends.ics">Add to your calendar</a>
    </section>

    <section class="ok-view" data-view="error" hidden>
      <h2 class="step-title">Link not found</h2>
      <p class="done-text">This one doesn't work anymore. DM me and I'll sort it out.</p>
      <a class="btn btn-primary" href="https://ig.me/m/8kblends">Open Instagram</a>
    </section>
  </main>
</div>
