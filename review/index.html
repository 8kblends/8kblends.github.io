<body class="theme-lightning review-page">
<div class="wrap">
  <header class="masthead">
    <img class="logo logo-sm" src="/assets/logo.webp" width="994" height="599" alt="8kblends, Crafted with Detail">
    <h1 class="byline">Tyler Campbell <span aria-hidden="true">·</span> Ty The Barber</h1>
  </header>

  <main class="panel">
    <h2 class="hook">How was your cut?</h2>
<form class="sheet-form review-form" data-review-form>
  <fieldset class="stars">
    <legend class="visually-hidden">Stars</legend>
    <label><input type="radio" name="stars" value="5" required><span aria-label="5 stars">★</span></label>
    <label><input type="radio" name="stars" value="4"><span aria-label="4 stars">★</span></label>
    <label><input type="radio" name="stars" value="3"><span aria-label="3 stars">★</span></label>
    <label><input type="radio" name="stars" value="2"><span aria-label="2 stars">★</span></label>
    <label><input type="radio" name="stars" value="1"><span aria-label="1 star">★</span></label>
  </fieldset>
  <div class="field-row">
    <label class="field"><span>First name</span><input name="first" autocomplete="given-name" maxlength="30" required></label>
    <label class="field"><span>Last name</span><input name="last" autocomplete="family-name" maxlength="30" required></label>
  </div>
  <label class="field"><span>What stood out? (optional)</span><input name="comment" maxlength="300" placeholder="Clean fade, good vibes…"></label>
  <label class="check"><input type="checkbox" name="ok_to_post" value="yes"><span>OK to post my before/after</span></label>
  <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button class="btn btn-primary" type="submit">Send review</button>
</form>

    <p class="contact-line"><span>Goes straight to Ty</span> <a href="/">My card</a></p>
  </main>

  <p class="fine">© 8kblends · Ty The Barber</p>
</div>

<dialog class="sheet" id="review-thanks" aria-labelledby="review-thanks-title">
  <form method="dialog" class="sheet-close-form">
    <button class="sheet-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </form>
  <p class="sheet-kicker">Thank you!</p>
  <h2 class="sheet-title" id="review-thanks-title">Now post your cut</h2>
  <p class="sheet-perk"><span aria-hidden="true">★</span> Tag @8kblends in your story and I'll repost you.</p>
  <a class="btn btn-primary" href="https://www.instagram.com/8kblends/" data-copy-tag="@8kblends" data-count="review-post">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>
    Copy @8kblends &amp; open IG
  </a>
  <button class="btn btn-tall btn-friend" type="button" data-open-sheet="friend-sheet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 13.8c1.8.9 3 2.9 3 5.2"/></svg>
    <span class="stack"><span>Send a friend</span><span class="sub">Share my card</span></span>
  </button>
  <form method="dialog"><button class="sheet-later">Done</button></form>
</dialog>
<dialog class="sheet" id="friend-sheet" aria-labelledby="friend-title">
  <form method="dialog" class="sheet-close-form">
    <button class="sheet-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </form>
  <p class="sheet-kicker">Send a friend</p>
  <h2 class="sheet-title" id="friend-title">Send my card to a friend</h2>
  <form class="sheet-form" data-friend-form>
    <label class="field">
      <span>Your first name, so I know who sent them</span>
      <input name="name" autocomplete="given-name" maxlength="24" required placeholder="First name">
    </label>
    <button class="btn btn-primary" type="submit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      Send my link
    </button>
  </form>
  <form method="dialog"><button class="sheet-later">Maybe later</button></form>
</dialog>
